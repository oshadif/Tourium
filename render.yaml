services:
  - type: web
    name: tourium
    runtime: node
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tourium-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_FROM
        value: bookings@example.com

databases:
  - name: tourium-db
    plan: free
    databaseName: tourium
    user: tourium
